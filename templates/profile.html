{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}My Profile{% endblock %}
{% block content %}
<h1>My profile</h1>
<div class="card form-card">
  <form method="post" data-validate novalidate>
    {{ csrf() }}
    <label>Email <input value="{{ user.email }}" disabled></label>
    <label>Full name * <input name="full_name" required maxlength="100" value="{{ user.full_name }}"></label>
    <label>ID number <input name="id_number" maxlength="30" value="{{ user.id_number }}"></label>
    <label>Program / department <input name="program" maxlength="100" value="{{ user.program }}"></label>
    <h2>Change password <small class="muted">(optional)</small></h2>
    <label>Current password <input type="password" name="current_password" autocomplete="current-password"></label>
    <label>New password <input type="password" name="new_password" minlength="8" autocomplete="new-password"></label>
    <label>Confirm new password <input type="password" name="confirm_password" autocomplete="new-password"></label>
    <button class="btn btn-primary">Save changes</button>
  </form>
</div>
{% endblock %}
